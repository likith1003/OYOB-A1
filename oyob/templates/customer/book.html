{% extends "base.html" %}

{% block title %}
otp
{% endblock title %}

{% block body %}
<center>
    <h1>Bike Booking</h1>
    
    <div id="bike">
        <h1>You are booking {{bike.bike_name}}</h1>
        <img src="{{bike.photo.url}}" alt="" style="width: 250px;">
    </div>
    <div id="book">
        <form method="post">
            {% csrf_token %}
            {{EBFO.as_p}}
            <input type="submit" value="Book">
        </form>
    </div>
</center>
{% endblock body %}
